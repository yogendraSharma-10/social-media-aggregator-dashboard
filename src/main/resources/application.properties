# ===================================================================
# Spring Boot Application Configuration
# ===================================================================
spring.application.name=social-media-aggregator-dashboard

# ===================================================================
# Server Configuration
# ===================================================================
server.port=8080
# Context path for the backend API to avoid conflicts with frontend routing
server.servlet.context-path=/api

# ===================================================================
# Logging Configuration
# ===================================================================
# Set default logging level to INFO for production
logging.level.root=INFO
# Set specific package logging level for more detailed logs during development if needed
logging.level.com.aggregator.dashboard=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# ===================================================================
# Caching Configuration (Using Caffeine)
# ===================================================================
# Enable caching. Caffeine is a high-performance, in-memory cache.
spring.cache.type=caffeine
# Configure the default cache specification for Caffeine
# - maximumSize: The maximum number of entries the cache can hold
# - expireAfterWrite: Evict entries after a fixed duration has elapsed since the entry's creation or last replacement
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=15m

# ===================================================================
# Scheduler (Background Job) Configuration
# ===================================================================
# Cron expression for the content refresh job.
# This example runs the job every 15 minutes.
# Format: second, minute, hour, day of month, month, day(s) of week
# See: https://www.freeformatter.com/cron-expression-generator-quartz.html
app.scheduler.content-refresh.cron=0 0/15 * * * ?

# ===================================================================
# External Social Media API Configuration
# ===================================================================
# NOTE: In a real production environment, these secrets should be externalized
# using environment variables, Spring Cloud Config, or a secrets manager (e.g., Vault, AWS Secrets Manager).
# For this project, we use placeholders.

# Twitter API (Simulated)
social.media.api.twitter.base-url=https://api.twitter.com/2
social.media.api.twitter.api-key=YOUR_TWITTER_API_KEY_PLACEHOLDER
social.media.api.twitter.api-secret=YOUR_TWITTER_API_SECRET_PLACEHOLDER

# Facebook Graph API (Simulated)
social.media.api.facebook.base-url=https://graph.facebook.com/v15.0
social.media.api.facebook.api-key=YOUR_FACEBOOK_API_KEY_PLACEHOLDER
social.media.api.facebook.api-secret=YOUR_FACEBOOK_API_SECRET_PLACEHOLDER

# Instagram Graph API (Simulated)
social.media.api.instagram.base-url=https://graph.instagram.com
social.media.api.instagram.api-key=YOUR_INSTAGRAM_API_KEY_PLACEHOLDER
social.media.api.instagram.api-secret=YOUR_INSTAGRAM_API_SECRET_PLACEHOLDER


# ===================================================================
# Security Configuration (OAuth2 Simulation)
# ===================================================================
# This section simulates OAuth2 client registration for a hypothetical platform.
# In a real application, you would have separate configurations for each provider (Google, GitHub, etc.).

spring.security.oauth2.client.registration.simulated-platform.client-id=dashboard-client-id
spring.security.oauth2.client.registration.simulated-platform.client-secret=dashboard-client-secret
spring.security.oauth2.client.registration.simulated-platform.scope=read:posts,write:posts,read:profile
spring.security.oauth2.client.registration.simulated-platform.authorization-grant-type=authorization_code
# The redirect URI must match the one configured in the OAuth2 provider.
spring.security.oauth2.client.registration.simulated-platform.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.simulated-platform.authorization-uri=http://localhost:9000/oauth2/authorize
spring.security.oauth2.client.provider.simulated-platform.token-uri=http://localhost:9000/oauth2/token
spring.security.oauth2.client.provider.simulated-platform.user-info-uri=http://localhost:9000/userinfo
spring.security.oauth2.client.provider.simulated-platform.user-name-attribute=name

# ===================================================================
# Spring Actuator Configuration
# ===================================================================
# Expose health and info endpoints for monitoring
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# ===================================================================
# Frontend Configuration
# ===================================================================
# URL of the frontend application for CORS configuration in SecurityConfig.
# Use a comma-separated list for multiple origins (e.g., dev, staging, prod).
app.cors.allowed-origins=http://localhost:3000